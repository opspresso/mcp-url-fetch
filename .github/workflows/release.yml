name: Release (ecr + ghcr)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

# One build per tag.
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_IMAGE: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-image-fetch
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-image-fetch

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::396608815058:role/github--mcp-image-fetch-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Attestations off: they turn a single-platform build into an image index
      # plus two untagged children, so every release costs three ECR entries
      # instead of one. Nothing here consumes the provenance.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_IMAGE }}:${{ github.ref_name }}
            ${{ env.ECR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
